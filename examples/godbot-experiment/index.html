<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Godbot 标识探索</title><style>
:root{color-scheme:light;--ink:#202034;--muted:#686a79;--paper:#f6f5f2;--card:#fff;--line:#e7e5e1}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}main{max-width:1120px;margin:auto;padding:42px 30px 60px}header{display:flex;justify-content:space-between;align-items:start;gap:24px;margin-bottom:26px}h1{font-size:30px;letter-spacing:-.04em;margin:0 0 7px}p{margin:0;color:var(--muted)}.tag{border:1px solid var(--line);border-radius:999px;padding:7px 12px;background:#fff;font-size:12px;white-space:nowrap}.brief{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0 22px}.brief span{padding:6px 10px;border-radius:999px;background:#e8e7f0;color:#44445d;font-size:12px}figure{margin:0;background:#fff;border:1px solid var(--line);border-radius:17px;padding:12px;overflow:hidden}figure img{display:block;width:100%;height:auto;border-radius:9px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:15px}.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:17px}.card h2{font-size:15px;margin:0 0 7px}.card p{font-size:13px;min-height:41px}.swatches{display:flex;gap:7px;margin-top:13px}.swatch{height:9px;flex:1;border-radius:9px}.section{margin-top:24px;padding:19px 21px;border-radius:14px;background:#eeedf4;color:#535366;font-size:13px}.section strong{color:#303047} .feedback{margin-top:16px;padding:18px 20px;background:#fff;border:1px solid var(--line);border-radius:14px}.feedback label{display:block;font-weight:650;margin-bottom:8px}.feedback textarea{display:block;width:100%;min-height:100px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;font:inherit;resize:vertical}.feedback-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.feedback button{border:1px solid var(--line);border-radius:7px;padding:8px 12px;background:#fff;color:var(--ink);font:inherit;cursor:pointer}.feedback button.primary{background:#4f55d8;border-color:#4f55d8;color:#fff}.feedback small,.feedback output{display:block;margin-top:8px;color:var(--muted)}.section a{color:#4644a0}@media(max-width:700px){main{padding:24px 16px}.grid{grid-template-columns:1fr}header{display:block}.tag{display:inline-block;margin-top:14px}}
</style></head><body><main><header><div><h1>Godbot 标识探索</h1><p>全新抽象形态 · 蓝紫配色方向 · 技能流程示例</p></div><span class="tag">归档示例</span></header><div class="brief"><span>不做吉祥物</span><span>不复用旧标识元素</span><span>蓝 → 紫</span></div><figure><img src="assets/color-exploration.png" alt="三个全新 Godbot 抽象标识候选的蓝紫配色探索"></figure><section class="grid"><article class="card"><h2>01 · 有机切面</h2><p>轮廓饱满，缩小后最稳定；但可能像普通云形或山形，记忆点还需加强。</p><div class="swatches"><i class="swatch" style="background:linear-gradient(90deg,#728BFF,#455BDA)"></i></div></article><article class="card"><h2>02 · 共用界面</h2><p>斜向留白更有记忆点；但可能像 A/K 字母或分流路径，需要继续去字母化。</p><div class="swatches"><i class="swatch" style="background:linear-gradient(90deg,#426DE0,#7A4FDB)"></i></div></article><article class="card"><h2>03 · 开放槽口</h2><p>结构稳定，但容易归为通用同步或链路图标，建议淘汰。</p><div class="swatches"><i class="swatch" style="background:linear-gradient(90deg,#4338A8,#8156E8)"></i></div></article></section><section class="feedback" aria-labelledby="feedback-title"><label id="feedback-title" for="feedback-input">试写评审建议</label><p>可直接写调整意见。内容只保存在当前浏览器，可复制。</p><textarea id="feedback-input" maxlength="500" placeholder="例如：保留 01 的轮廓，内凹口再放宽一些……"></textarea><div class="feedback-actions"><button class="primary" id="save-feedback" type="button">保存到本机</button><button id="copy-feedback" type="button">复制建议</button><button id="clear-feedback" type="button">清空</button></div><output id="feedback-status" aria-live="polite">未保存</output></section><aside class="section"><strong>案例状态：</strong>对方未采用本轮方案。三款候选、蓝紫配色和评审意见随案例归档，供其他设计项目参考。<a href="https://github.com/renjiegod/dsh-godbot">项目资料</a>。</aside></main><script>
(()=>{
  const key='godbot-logo-experiment-feedback';
  const input=document.getElementById('feedback-input');
  const status=document.getElementById('feedback-status');
  try { input.value=localStorage.getItem(key)||''; status.textContent=input.value?'已载入本机建议':'未保存'; }
  catch { status.textContent='当前浏览器不允许本地保存'; }
  document.getElementById('save-feedback').addEventListener('click',()=>{
    try { localStorage.setItem(key,input.value); status.textContent='建议已保存在当前浏览器'; }
    catch { status.textContent='保存失败，请复制建议后另行保存'; }
  });
  document.getElementById('copy-feedback').addEventListener('click',async()=>{
    if(!input.value.trim()){status.textContent='先写下建议';input.focus();return;}
    try { await navigator.clipboard.writeText(input.value.trim()); status.textContent='建议已复制'; }
    catch { input.focus(); input.select(); status.textContent='无法自动复制，文字已选中'; }
  });
  document.getElementById('clear-feedback').addEventListener('click',()=>{
    input.value='';
    try { localStorage.removeItem(key); status.textContent='本机建议已清空'; }
    catch { status.textContent='内容已清空'; }
  });
})();
</script></body></html>
